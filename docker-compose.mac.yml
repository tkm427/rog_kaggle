services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.mac
    image: kaggle-workspace-mac
    container_name: kaggle-workspace-mac
    environment:
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
      - WANDB_API_KEY=${WANDB_API_KEY}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    shm_size: '4gb'          # DataLoader マルチプロセス用の共有メモリ
    ports:
      - "8888:8888"          # Jupyter
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
