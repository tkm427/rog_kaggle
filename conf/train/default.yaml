# tvt_regime.md p95 を稀少レジーム（境界跨ぎ）の閾値として規約化
rare_threshold: 0.91

# 学習対象は tail 行のみ（prefix は target leakage に近いため学習には使わない）
train_on_tail_only: true

gr_rolling_windows: [10, 30, 100]

# 素朴な全系列DTW（dtw_align、exp001）・anchor制約付きbeam search（beam_alignment_features、exp002）
# いずれも実用不可と判明（postmortems/pm001_beam_alignment_drift.md 参照: 短horizonのsanity checkは
# 通過したが、実際のtail長（平均4867行）では累積drift（RMSE 100〜500ft）が発生しOOFを悪化させた）。
# 関数自体は将来の再設計用に残し、デフォルトでは無効化する。
enable_beam_features: false
